<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fuel Flow - Vehicle & Fuel Tracker</title>
    <meta name="description" content="Track fuel efficiency, mileage logs, and maintenance in real time." />
    <meta name="theme-color" content="#FF5200" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fuel Flow" />
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/google-sans" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA ServiceWorker registered:', reg.scope))
            .catch(err => console.log('PWA ServiceWorker registration failed:', err));
        });
      }

      // Automatically remove any injected Vercel Toolbar elements
      const removeVercelToolbar = () => {
        const selectors = ['vercel-toolbar', 'vercel-live-feedback', '#vercel-toolbar', '[data-vercel-toolbar]', '.vercel-toolbar'];
        selectors.forEach(selector => {
          document.querySelectorAll(selector).forEach(el => el.remove());
        });
      };
      removeVercelToolbar();
      const observer = new MutationObserver(removeVercelToolbar);
      observer.observe(document.documentElement, { childList: true, subtree: true });
    </script>
  </body>
</html>
