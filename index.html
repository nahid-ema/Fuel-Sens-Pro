    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23FF5200%22/><g transform=%22translate(20,20) scale(2.5)%22 fill=%22none%22 stroke=%22white%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22m21 8-2 2-1.5-3.7A2 2 0 0 0 15.64 5H8.4a2 2 0 0 0-1.9 1.3L5 10 3 8%22/><path d=%22M1 11.5 3 17h18l2-5.5%22/><path d=%22m7.5 12 2-3.5h5l2 3.5%22/><path d=%22M3 14h18%22/><path d=%22M5 17v4a1 1 0 0 0 1 1h0a1 1 0 0 0 1-1v-4%22/><path d=%22M17 17v4a1 1 0 0 0 1 1h0a1 1 0 0 0 1-1v-4%22/></g></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA ServiceWorker registered:', reg.scope))
            .catch(err => console.log('PWA ServiceWorker registration failed:', err));
        });
      }

      // Automatically remove any injected Vercel Toolbar elements
      const removeVercelToolbar = () => {
        const selectors = ['vercel-toolbar', 'vercel-live-feedback', '#vercel-toolbar', '[data-vercel-toolbar]', '.vercel-toolbar'];
        selectors.forEach(selector => {
          document.querySelectorAll(selector).forEach(el => el.remove());
        });
      };
      removeVercelToolbar();
      const observer = new MutationObserver(removeVercelToolbar);
      observer.observe(document.documentElement, { childList: true, subtree: true });
    </script>
  </body>
</html>
